<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#0b111b">

<title>Hockey Performance</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#0b111b;color:#f5f7fc;font-family:system-ui,-apple-system,sans-serif}

header{padding:25px 20px;background:#141e2d}

small,.muted{color:#9caabd}

h1{font-size:27px;margin:8px 0}

h2{font-size:20px}

main{max-width:700px;margin:auto;padding:18px}

.card{background:#172233;border:1px solid #29374a;border-radius:17px;padding:17px;margin:13px 0}

button{background:#326dff;border:0;color:white;border-radius:11px;padding:12px 15px;font-size:15px;font-weight:600;cursor:pointer}

button.secondary{background:#28364b}

button.done{background:#147d61}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px}

.exercise{border-top:1px solid #344154;padding:15px 0}

.exercise h3{font-size:16px;margin:0 0 6px}

.exercise p{color:#aab7c8;font-size:13px}

.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.set{background:#29384e;min-width:48px}

.set.checked{background:#147d61}

input{background:#101a29;border:1px solid #40506a;border-radius:8px;color:white;padding:10px;width:90px}

.hidden{display:none}

#timer{font-size:38px;font-weight:800;margin:10px 0}

nav{display:flex;gap:8px;margin:15px 0}

nav button{flex:1}

</style>

</head>
